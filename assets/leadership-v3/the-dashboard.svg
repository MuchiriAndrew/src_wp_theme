<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 160" width="280" height="160" role="img" aria-label="Two analysts reviewing a rising chart"><title>Two analysts reviewing a rising chart</title><style>
    .s{fill:none;stroke:#2B2B2B;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .s .fig circle{fill:#fff}
    .acc{stroke:#8A8C8F} .accf{fill:#8A8C8F;stroke:#8A8C8F}
    .bub{fill:#fff;stroke:#2B2B2B;stroke-width:2.2}
    .chair{stroke:#8A8C8F}
    .ground{stroke:#2B2B2B;stroke-width:2;opacity:.25}
    .b1{animation:pop1 6s ease-in-out infinite}
    .b2{animation:pop2 6s ease-in-out infinite}
    @keyframes pop1{0%,4%{opacity:0;transform:scale(.6)}10%,44%{opacity:1;transform:scale(1)}50%,100%{opacity:0;transform:scale(.6)}}
    @keyframes pop2{0%,50%{opacity:0;transform:scale(.6)}56%,92%{opacity:1;transform:scale(1)}98%,100%{opacity:0;transform:scale(.6)}}
    .talk1 .armR{animation:gest 6s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 0%}
    .talk2 .armL{animation:gest2 6s ease-in-out infinite;transform-box:fill-box;transform-origin:100% 0%}
    @keyframes gest{0%,8%,46%,100%{transform:rotate(0)}18%,34%{transform:rotate(-12deg)}}
    @keyframes gest2{0%,54%,96%,100%{transform:rotate(0)}66%,82%{transform:rotate(12deg)}}
    .spin{animation:spin 6s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 1.2s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(-2px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
    </style><g class="s"><line class="ground" x1="12" y1="140" x2="268" y2="140"/><rect x="108" y="110" width="16" height="30" class="accf" style="fill-opacity:.35"/><rect x="130" y="90" width="16" height="50" class="accf" style="fill-opacity:.35"/><rect x="152" y="68" width="16" height="72" class="accf" style="fill-opacity:.35"/><polyline points="104,104 126,82 148,80 172,54" stroke="#B3262C"/><path d="M172,54 l-9,1 m9,-1 l-2,9" stroke="#B3262C"/><g class="fig talk1"><circle cx="66" cy="60" r="10"/><line x1="66" y1="70" x2="66" y2="106"/><polyline class="armL" points="66,78 56,96 52,110"/><polyline class="armR" points="66,78 84,74 100,64"/><line x1="66" y1="106" x2="57" y2="140"/><line x1="66" y1="106" x2="75" y2="140"/></g><g class="fig talk2"><circle cx="218" cy="60" r="10"/><line x1="218" y1="70" x2="218" y2="106"/><polyline class="armL" points="218,78 200,82 190,76"/><polyline class="armR" points="218,78 228,96 232,108"/><line x1="218" y1="106" x2="209" y2="140"/><line x1="218" y1="106" x2="227" y2="140"/></g><circle cx="182" cy="70" r="8"/><line x1="187" y1="76" x2="192" y2="80"/><g class="bubble b1" style="transform-origin:60px 48px"><path d="M32,8 H70 Q80,8 80,18 V24 Q80,34 70,34 H66 L60,48 L54,34 H32 Q22,34 22,24 V18 Q22,8 32,8 Z" class="bub"/><path d="M51,30 l0,-14 m-6,6 l6,-6 l6,6" stroke="#B3262C"/></g><g class="bubble b2" style="transform-origin:214px 48px"><path d="M206,8 H240 Q250,8 250,18 V24 Q250,34 240,34 H220 L214,48 L208,34 H206 Q196,34 196,24 V18 Q196,8 206,8 Z" class="bub"/><circle cx="214" cy="21" r="2.6" fill="#B3262C" stroke="none"/><circle cx="223" cy="21" r="2.6" fill="#B3262C" stroke="none"/><circle cx="232" cy="21" r="2.6" fill="#B3262C" stroke="none"/></g></g></svg>